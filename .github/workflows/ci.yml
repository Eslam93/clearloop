name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token, no secrets: a stranger's pull request can run every job.
# Deploys are Vercel's Git integration, so CI never holds deploy credentials.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, unit tests, build, bundle canary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the workflows themselves
        run: pnpm check:workflows && pnpm test:scripts
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Unit and property tests
        run: pnpm --filter @clearloop/business-time test && pnpm --filter @clearloop/web test
      - run: pnpm build
      - name: No tenant data in what the browser downloads
        run: pnpm check:bundle

  database:
    name: Tenancy and integration tests (Postgres 17)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The service's superuser only creates the test database and runs migrations. Every claim is
      # tested through the clearloop_app role (NOSUPERUSER NOBYPASSRLS): a superuser skips
      # row-level security and would make the tests prove nothing.
      TEST_DATABASE_OWNER_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @clearloop/db test
      - run: pnpm --filter @clearloop/web test:integration

  e2e:
    name: End-to-end and accessibility (production build)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_OWNER: postgres://postgres:postgres@localhost:5432/clearloop
      APP_DB_PASSWORD: clearloop_app_ci
      DATABASE_URL: postgres://clearloop_app:clearloop_app_ci@localhost:5432/clearloop
      # A throwaway value for this job's database only; not a secret.
      SESSION_SECRET: ci-only-session-secret-for-a-throwaway-database
      SANDBOX_RATE_LIMIT: "1000"
      E2E_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create and migrate the database
        run: CREATE_DATABASE=1 pnpm db:migrate
      - run: pnpm build
      - name: Install the browser
        run: pnpm --filter @clearloop/web exec playwright install --with-deps chromium
      - name: Start the production server
        run: |
          pnpm --filter @clearloop/web start > server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf "$E2E_BASE_URL/api/health" && exit 0
            sleep 2
          done
          cat server.log
          exit 1
      - run: pnpm --filter @clearloop/web e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
            server.log
          retention-days: 7

  guards:
    name: Every guard is shown to matter
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_OWNER_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build (the bundle canary guard needs .next/static)
        run: pnpm build
      - name: Remove each guard; its tests must fail
        run: pnpm guards
