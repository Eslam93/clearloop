name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token, no secrets: a stranger's pull request can run every job.
# Deploys are Vercel's Git integration, so CI never holds deploy credentials.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the workflows themselves
        run: pnpm check:workflows && pnpm test:scripts
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
